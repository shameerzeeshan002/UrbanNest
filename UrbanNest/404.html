<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#0d1117;
    color:white;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
    position:fixed;
    width:100%;
    z-index:1000;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(10px);
}

nav h2{
    color:#f5b841;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    transition:.3s;
}

nav ul li a:hover{
    color:#f5b841;
}

.error-wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 20px;
}

.error-code{
    font-size:130px;
    font-weight:bold;
    color:#f5b841;
    line-height:1;
}

.error-wrap h1{
    font-size:30px;
    margin:15px 0;
}

.error-wrap p{
    color:#aaa;
    max-width:450px;
    margin-bottom:30px;
    line-height:1.7;
}

.error-btn{
    padding:14px 30px;
    background:#f5b841;
    color:#000;
    text-decoration:none;
    border-radius:8px;
    font-weight:600;
    transition:.3s;
}

.error-btn:hover{
    transform:translateY(-4px);
}

@media(max-width:600px){
.error-code{
    font-size:90px;
}
}

</style>
<link rel="stylesheet" href="assets/site-extra.css">
