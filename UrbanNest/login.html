<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UrbanNest - Login / Sign Up</title>
<meta name="description" content="Login or create your UrbanNest account to save favorite properties and manage inquiries.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#0d1117;
    color:white;
    min-height:100vh;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
    position:fixed;
    width:100%;
    z-index:1000;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(10px);
}

nav h2{
    color:#f5b841;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    transition:.3s;
}

nav ul li a:hover{
    color:#f5b841;
}

.auth-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:120px 20px 60px;
    background:url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c') center/cover;
    position:relative;
}

.auth-wrap::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.75);
}

.auth-box{
    position:relative;
    z-index:2;
    background:#161b22;
    border-radius:16px;
    padding:40px;
    width:100%;
    max-width:420px;
}

.auth-tabs{
    display:flex;
    margin-bottom:25px;
    background:#0d1117;
    border-radius:8px;
    padding:5px;
}

.auth-tabs button{
    flex:1;
    padding:12px;
    border:none;
    background:transparent;
    color:#aaa;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

.auth-tabs button.active{
    background:#f5b841;
    color:#000;
}

.auth-form{
    display:none;
    flex-direction:column;
    gap:15px;
}

.auth-form.active{
    display:flex;
}

.auth-form input{
    padding:14px;
    border:none;
    border-radius:8px;
    background:#0d1117;
    color:white;
}

.auth-form button.submit-btn{
    padding:14px;
    border:none;
    border-radius:8px;
    background:#f5b841;
    color:#000;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.auth-form button.submit-btn:hover{
    transform:translateY(-3px);
}

.auth-box h2{
    text-align:center;
    margin-bottom:20px;
}

.auth-box h2 span{
    color:#f5b841;
}

.switch-text{
    text-align:center;
    margin-top:15px;
    color:#aaa;
    font-size:14px;
}

.switch-text a{
    color:#f5b841;
    text-decoration:none;
    cursor:pointer;
}

.form-msg{
    text-align:center;
    font-size:14px;
    color:#f5b841;
    margin-top:5px;
    display:none;
}

.form-msg.show{
    display:block;
}

</style>
<link rel="stylesheet" href="assets/site-extra.css">
</head>

<body>

<nav>
<h2><a href="home.html" class="brand-link">UrbanNest</a></h2>
<button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
<ul id="navMenu">
<li><a href="home.html">Home</a></li>
<li><a href="buy.html">Buy</a></li>
<li><a href="rent.html">Rent</a></li>
<li><a href="commercial.html">Commercial</a></li>
<li><a href="about.html">About</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>
</nav>

<section class="auth-wrap">
<div class="auth-box">

<h2>Welcome To <span>UrbanNest</span></h2>

<div class="auth-tabs">
<button id="loginTab" class="active">Login</button>
<button id="signupTab">Sign Up</button>
</div>

<form class="auth-form active" id="loginForm">
<input type="email" placeholder="Email Address" required>
<input type="password" placeholder="Password" required>
<button type="submit" class="submit-btn">Login</button>
<p class="form-msg" id="loginMsg"></p>
</form>

<form class="auth-form" id="signupForm">
<input type="text" placeholder="Full Name" required>
<input type="email" placeholder="Email Address" required>
<input type="password" placeholder="Password" required>
<button type="submit" class="submit-btn">Create Account</button>
<p class="form-msg" id="signupMsg"></p>
</form>

<p class="switch-text" id="switchText">Don't have an account? <a id="toSignup">Sign up</a></p>

</div>
</section>

<script>
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const switchText = document.getElementById("switchText");

    function showLogin() {
        loginTab.classList.add("active");
        signupTab.classList.remove("active");
        loginForm.classList.add("active");
        signupForm.classList.remove("active");
        switchText.innerHTML = 'Don\'t have an account? <a id="toSignup">Sign up</a>';
        document.getElementById("toSignup").addEventListener("click", showSignup);
    }

    function showSignup() {
        signupTab.classList.add("active");
        loginTab.classList.remove("active");
        signupForm.classList.add("active");
        loginForm.classList.remove("active");
        switchText.innerHTML = 'Already have an account? <a id="toLogin">Login</a>';
        document.getElementById("toLogin").addEventListener("click", showLogin);
    }

    loginTab.addEventListener("click", showLogin);
    signupTab.addEventListener("click", showSignup);
    document.getElementById("toSignup").addEventListener("click", showSignup);

    loginForm.addEventListener("submit", function (e) {
        e.preventDefault();
        const msg = document.getElementById("loginMsg");
        msg.textContent = "This is a demo form — login isn't connected to a server yet.";
        msg.classList.add("show");
    });

    signupForm.addEventListener("submit", function (e) {
        e.preventDefault();
        const msg = document.getElementById("signupMsg");
        msg.textContent = "This is a demo form — sign up isn't connected to a server yet.";
        msg.classList.add("show");
    });
</script>
<script src="assets/site-extra.js"></script>
</body>
</html>
